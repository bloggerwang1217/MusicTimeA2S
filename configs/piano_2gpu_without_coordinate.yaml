# Piano audio-to-score, without PhaseModel — two-GPU training
# =====================================
#
# batch_size is per rank: 4 × 2 GPUs preserves the single-GPU effective batch
# of 8.
#
# Arm A (no musical-time coordinate): no phase branch, no phase supervision.
# hFT -> converter -> global Conformer -> decoder cross-attention. Same decoder,
# converter, and Conformer sizes as the headline run.

seed:
  training: 42
  # Seeds 91 and 1217 were trained from this same file with only this value
  # changed; their checkpoints are checkpoints/<arm>_seed<seed>.pt.

# =============================================================================
# Model
# =============================================================================
model:
  name: "piano-a2s-without-coordinate"

  hft_state_dict: "checkpoints/hft/hft_maestro_v3_statedict.pt"
  hft_parameter_json: "checkpoints/hft/parameter.json"

  n_queries: 32
  d_model: 256
  n_heads: 4

  phase_model: false

  n_conformer_layers: 2
  conformer_kernel: 65


  ff_dim: 1024
  n_layers: 4
  dropout: 0.1
  max_seq_len: 2048
  label_smoothing: 0.0

# =============================================================================
# Data
# =============================================================================
data:
  chunking:
    chunk_frames: 1280
    overlap_frames: 640

# =============================================================================
# Objective: score cross-entropy only
# =============================================================================
loss:
  lambda_score: 1.0

# =============================================================================
# Training
# =============================================================================
training:
  batch_size: 4
  gradient_accumulation_steps: 1
  gradient_clip: 2.0

  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 50
  warmup_steps: 1000
  lr_min_ratio: 0.1

  save_every_n_epochs: 5
  early_stopping_patience: 5

# =============================================================================
# Paths
# =============================================================================
paths:
  manifest_dir: "data/experiments/syn"
  checkpoint_dir: "checkpoints/without_coordinate"
